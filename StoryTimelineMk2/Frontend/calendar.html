<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Editor</title>
    <style>
      html, body { background: #0f172a; margin: 0; padding: 0; }
      #app-loading {
        position: fixed; inset: 0;
        background: #0f172a;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.25s ease;
      }
      #app-loading.fade-out { opacity: 0; pointer-events: none; }
      #app-loading-dot {
        width: 24px; height: 24px;
        border-radius: 50%;
        background: #79876b;
        animation: app-ld 1.4s ease-in-out infinite;
      }
      @keyframes app-ld {
        0%, 100% { transform: scale(0.7); opacity: 0.4; }
        50%       { transform: scale(1.05); opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="app-loading"><div id="app-loading-dot"></div></div>
    <div id="app"></div>
    <script type="module" src="/src/calendar.ts"></script>
  </body>
</html>
